[package]
name = "rotfall"
version = "1.0.0"
license = "GPL-3.0-only"
description = "Top-down 3D wave survival shooter with base building and co-op"
repository = "https://github.com/1stwbsm/rotfall"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.34.2"
png = "0.18.1"
pollster = "1.0.1"
# Vulkan and OpenGL only. DirectX 12 is deliberately left out of the build.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
winit = "0.30.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# The browser build. WebGPU is its only graphics path: the renderer needs storage buffers.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "webgpu", "wgsl"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-time = "1"
web-sys = { version = "0.3", features = ["Window", "Location", "Screen", "Navigator", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Document", "Element", "HtmlElement", "Storage", "console", "AudioContext", "AudioContextOptions", "BaseAudioContext", "AudioNode", "AudioDestinationNode", "ScriptProcessorNode", "AudioProcessingEvent", "AudioBuffer", "EventTarget"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
strip = true
